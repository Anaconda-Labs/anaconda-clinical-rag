name: Intake Quality Check

on:
  pull_request:
    paths:
      - 'registry.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-registry-entry:
    name: Validate registry.yml syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Validate registry.yml
        run: |
          python - << 'EOF'
          import yaml, sys

          REQUIRED_FIELDS = [
              'repo', 'org', 'type', 'owner_github',
              'last_tested', 'status', 'registered', 'reviewed_by'
          ]
          VALID_TYPES = ['guide', 'show', 'tell']
          VALID_STATUSES = ['active', 'needs_review', 'archived']

          with open('registry.yml') as f:
              data = yaml.safe_load(f)

          issues = []
          for i, resource in enumerate(data.get('resources', [])):
              prefix = f"Entry {i+1} ({resource.get('repo', 'unknown')})"
              for field in REQUIRED_FIELDS:
                  if not resource.get(field):
                      issues.append(f"{prefix}: missing required field '{field}'")
              if resource.get('type') not in VALID_TYPES:
                  issues.append(f"{prefix}: type must be one of {VALID_TYPES}")
              if resource.get('status') not in VALID_STATUSES:
                  issues.append(f"{prefix}: status must be one of {VALID_STATUSES}")

          if issues:
              print("registry.yml validation FAILED:\n")
              for issue in issues:
                  print(f"  ✗ {issue}")
              sys.exit(1)
          else:
              print(f"registry.yml is valid ✓ ({len(data['resources'])} resources)")
          EOF

  check-resource-quality:
    name: Check resource quality criteria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Get new/changed registry entries
        id: get-entries
        run: |
          python - << 'EOF'
          import yaml, json, subprocess, sys

          # Fetch origin/main to compare against
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)

          # Get base (main) and head (PR branch) versions of registry.yml
          try:
              result_base = subprocess.run(
                  ['git', 'show', 'origin/main:registry.yml'],
                  capture_output=True, text=True, check=True
              )
              base_data = yaml.safe_load(result_base.stdout)
              base_repos = {r['repo'] for r in base_data.get('resources', [])}
          except subprocess.CalledProcessError:
              print("Could not get base registry.yml, treating all entries as new")
              base_repos = set()

          # Get current (head) version
          with open('registry.yml') as f:
              head_data = yaml.safe_load(f)

          # Find only NEW entries (repos in head but not in base)
          new_repo_names = {r['repo'] for r in head_data.get('resources', [])} - base_repos
          entries = [r for r in head_data['resources'] if r['repo'] in new_repo_names]

          print(f"New entries to check: {len(entries)}")
          if entries:
              print(f"Repos: {', '.join(e['repo'] for e in entries)}")
          else:
              print("No new resources to check")

          with open('entries.json', 'w') as f:
              json.dump(entries, f)
          EOF

      - name: Run quality checks against each resource
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          python - << 'EOF'
          import json, os, sys, subprocess, tempfile, shutil

          with open('entries.json') as f:
              entries = json.load(f)

          if not entries:
              print("No new resources to check - skipping quality checks")
              sys.exit(0)

          gh_token = os.environ.get('GH_TOKEN', '')
          all_passed = True

          for entry in entries:
              org = entry['org']
              repo = entry['repo']
              resource_type = entry['type']
              # Use source_org if present (for pre-transfer validation), otherwise use org
              source_org = entry.get('source_org', org)

              print(f"\nChecking {source_org}/{repo} (type: {resource_type})")
              if source_org != org:
                  print(f"  (will transfer to {org} after intake)")
              print("-" * 40)

              # Clone the resource repo from its current location
              clone_url = f"https://x-access-token:{gh_token}@github.com/{source_org}/{repo}.git"
              tmpdir = tempfile.mkdtemp()
              try:
                  result = subprocess.run(
                      ['git', 'clone', '--depth', '1', clone_url, tmpdir],
                      capture_output=True, text=True
                  )
                  if result.returncode != 0:
                      print(f"  Could not clone {source_org}/{repo}: {result.stderr}")
                      all_passed = False
                      continue

                  # Run quality check
                  env = os.environ.copy()
                  env['REPO_PATH'] = tmpdir
                  env['RESOURCE_TYPE'] = resource_type
                  result = subprocess.run(
                      ['python', '.github/scripts/quality_check.py'],
                      env=env, capture_output=False
                  )
                  if result.returncode != 0:
                      all_passed = False
              finally:
                  shutil.rmtree(tmpdir, ignore_errors=True)

          if not all_passed:
              print("\nOne or more resources failed quality checks.")
              sys.exit(1)
          else:
              print("\nAll resources passed quality checks ✓")
          EOF
